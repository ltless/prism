name: CI
on:
  push:
    branches: [beta, main]
  pull_request:
    branches: [beta]
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # The init user is a superuser, and superusers bypass RLS — the
          # tenant-isolation tests would fail. Use the default `postgres`
          # admin, then connect as a non-superuser `prism` role created in
          # the init step below (mirrors production, where the app never
          # runs as superuser).
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prism_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Non-superuser credentials, created by the init-db step.
      PRISM_TEST_DB: postgresql://prism:prism_ci_pw@localhost:5432/prism_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Init test DB role (non-superuser, like production)
        run: |
          psql postgresql://postgres:postgres@localhost:5432/prism_test --command "
            CREATE ROLE prism LOGIN PASSWORD 'prism_ci_pw' NOSUPERUSER;
            GRANT ALL ON DATABASE prism_test TO prism;
            GRANT ALL ON SCHEMA public TO prism;"
      - run: pnpm lint
      - name: Security audit (npm)
        run: pnpm audit --audit-level=high || true
      - name: Go vet
        working-directory: backend
        run: go vet ./...
      - name: Go build
        working-directory: backend
        run: go build ./...
      - name: Go test
        working-directory: backend
        run: go test -p 1 -count=1 ./...
      - run: pnpm test
      - run: pnpm build
        env:
          AUTH_SECRET: ci-build-placeholder-not-a-real-secret
          JWT_SECRET: ci-build-placeholder-not-a-real-secret