name: CI
on:
  push:
    branches: [beta, main]
  pull_request:
    branches: [beta]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache-dependency-path: backend/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Security audit (npm)
        run: pnpm audit --audit-level=high || true
      - name: Go vet
        working-directory: backend
        run: go vet ./...
      - name: Go build
        working-directory: backend
        run: go build ./...
      - name: Go test
        working-directory: backend
        run: go test ./...
      - run: pnpm test
      - run: pnpm build
        env:
          AUTH_SECRET: ci-build-placeholder-not-a-real-secret
          JWT_SECRET: ci-build-placeholder-not-a-real-secret