services:
  postgres:
    image: postgres:16-alpine
    container_name: prism-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: prism
      POSTGRES_USER: prism
      # No committed default — docker compose fails loudly if unset.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (scripts/setup.js generates one)}
    ports:
      # Loopback only — never expose postgres to other interfaces.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism -d prism"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://prism:${POSTGRES_PASSWORD:?}@postgres:5432/prism
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?ENCRYPTION_MASTER_KEY must be set (openssl rand -hex 32)}
      STORAGE_PATH: /data
      PORT: "8080"
      REGISTRATION_INVITE_CODE: ${REGISTRATION_INVITE_CODE:-}
      REQUIRE_INVITE: "true"
    volumes:
      - prism-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # rewrites() bakes BACKEND_URL at build time (routes manifest) —
        # must be the in-network service name, not localhost.
        AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
        JWT_SECRET: ${JWT_SECRET:?}
        BACKEND_URL: http://backend:8080
        GO_API_URL: http://backend:8080
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      JWT_SECRET: ${JWT_SECRET:?}
      BACKEND_URL: http://backend:8080
      GO_API_URL: http://backend:8080
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  prism-data: