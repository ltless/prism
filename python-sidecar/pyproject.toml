[project]
name = "prism-ai-sidecar"
version = "0.1.0"
description = "Prism AI sidecar - CLIP + aesthetic + tagger inference via PyTorch (CPU-first)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "transformers>=4.40,<5",
    "torch>=2.4",
    "torchvision>=0.20",
    "pillow>=10",
    "numpy>=1.26",
    "huggingface-hub>=0.25",
    # RAM++ tagger — not on PyPI; the upstream GitHub repo builds a dist named
    # `ram` (import is `from ram.models import ram_plus`). Source in [tool.uv.sources].
    "ram",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
# RAM++ tagger is not published on PyPI; the upstream GitHub repo builds a dist
# named `ram`. Pull it from there instead of the (unrelated) PyPI `ram` package.
ram = { git = "https://github.com/xinyu1205/recognize-anything.git" }

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
